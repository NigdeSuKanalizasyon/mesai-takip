<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Fazla Mesai taşındı</title>
  <style>
    :root {
      --zemin: #f3f5f3;
      --kart: #ffffff;
      --yazi: #17251f;
      --soluk: #5b6b64;
      --ana: #1f6b4f;
      --ana-yazi: #ffffff;
      --cizgi: #dfe5e1;
      color-scheme: light dark;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --zemin: #101a17;
        --kart: #16231f;
        --yazi: #e8efeb;
        --soluk: #9aaba3;
        --ana: #3fa37a;
        --ana-yazi: #0c1512;
        --cizgi: #24352f;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px 16px;
      background: var(--zemin);
      color: var(--yazi);
      font: 17px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    main {
      width: 100%;
      max-width: 420px;
      background: var(--kart);
      border: 1px solid var(--cizgi);
      border-radius: 16px;
      padding: 28px 24px;
    }
    h1 { margin: 0 0 12px; font-size: 1.5rem; line-height: 1.25; }
    p { margin: 0 0 20px; color: var(--soluk); }
    a.dugme {
      display: block;
      text-align: center;
      padding: 14px 16px;
      border-radius: 12px;
      background: var(--ana);
      color: var(--ana-yazi);
      font-weight: 600;
      text-decoration: none;
    }
    a.dugme:focus-visible { outline: 3px solid var(--yazi); outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <h1>Fazla Mesai taşındı</h1>
    <p>Bu eski sürüm kapatıldı. Fazla Mesai artık Uygulamalar'ın içinde. Bu simgeyi telefonunuzdan kaldırabilirsiniz.</p>
    <a class="dugme" href="https://nigdesukanalizasyon.github.io/uygulamalar/">Uygulamalar'ı aç</a>
  </main>
</body>
</html>
